<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-icue-framework-version" content="1.0.1">
    <meta name="x-icue-interactive">
    <title>tr('EA Home Control')</title>
    <link rel="icon" type="image/svg+xml" href="resources/ea-home-control.svg">

    <meta name="x-icue-restrictions"
        data-restrictions='[{"device":"dashboard_lcd"}]'>

    <!-- Settings: Group 1 - Home Control -->
    <meta name="x-icue-property" content="haUrl"
        data-label="tr('Home Assistant URL')" data-type="textfield" data-default="'http://homeassistant.local:8123'">
    <meta name="x-icue-property" content="haToken"
        data-label="tr('Access Token')" data-type="textfield" data-default="''">
    <meta name="x-icue-property" content="showDevices"
        data-label="tr('Show Devices')" data-type="tab-buttons"
        data-values="[{'key':'all','value':tr('All')},{'key':'label','value':tr('Labeled Only')}]"
        data-default="'all'">
    <meta name="x-icue-property" content="haLabel"
        data-label="tr('Device Label')" data-type="textfield" data-default="'xeneon'">
    <meta name="x-icue-property" content="layoutMode"
        data-label="tr('Layout')" data-type="tab-buttons"
        data-values="[{'key':'rooms','value':tr('Rooms')},{'key':'flat','value':tr('All Devices')}]"
        data-default="'rooms'">
    <meta name="x-icue-property" content="customTitle"
        data-label="tr('Custom Title')" data-type="textfield" data-default="''">

    <!-- Settings: Group 2 - Widget Personalization -->
    <meta name="x-icue-property" content="backgroundMedia"
        data-label="tr('Background Image')" data-type="media-selector"
        data-filters="['*.png','*.jpg','*.jpeg','*.webp']">
    <meta name="x-icue-property" content="glassBlur"
        data-label="tr('Glass Blur')" data-type="slider"
        data-min="0" data-max="30" data-step="1" data-default="0">
    <meta name="x-icue-property" content="textColor"
        data-label="tr('Text Color')" data-type="color" data-default="'#E0E0E0'">
    <meta name="x-icue-property" content="accentColor"
        data-label="tr('Active Color')" data-type="color" data-default="'#FFAE30'">
    <meta name="x-icue-property" content="secondaryColor"
        data-label="tr('Sensor Color')" data-type="color" data-default="'#009BFF'">
    <meta name="x-icue-property" content="backgroundColor"
        data-label="tr('Background Color')" data-type="color" data-default="'#4F5458'">
    <meta name="x-icue-property" content="transparency"
        data-label="tr('Transparency')" data-type="slider"
        data-default="100" data-min="0" data-max="100" data-step="1">

    <script type="application/json" id="x-icue-groups">
    [
        {
            "title": "tr('Home Control')",
            "properties": ["haUrl", "haToken", "showDevices", "haLabel", "layoutMode", "customTitle"],
            "info": "`Connects directly to Home Assistant. Create a long-lived access token in Home Assistant (Profile > Security), then paste it here. Show Devices: All lists every light, switch, fan, thermostat, cover, lock, media player and scene (hide an entity in Home Assistant to remove it), plus anything carrying the Device Label, such as sensors. Labeled Only shows just the labeled ones. Layout: Rooms opens one room at a time; All Devices shows everything at once. Tap to toggle, press and hold for more controls. Enter demo as the URL to try it without Home Assistant.`"
        },
        {
            "title": "tr('Widget Personalization')",
            "properties": ["backgroundMedia", "glassBlur", "textColor", "accentColor", "secondaryColor", "backgroundColor", "transparency"]
        }
    ]
    </script>

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --text-color: #E0E0E0;
            --accent-color: #FFAE30;
            --secondary-color: #009BFF;
            --bg-color: #4F5458;
            --widget-opacity: 1.0;
            --bg-blur: 0px;
            --tile-bg: color-mix(in srgb, var(--text-color) 8%, transparent);
            --tile-on: color-mix(in srgb, var(--accent-color) 24%, transparent);
            --text-muted: color-mix(in srgb, var(--text-color) 58%, var(--bg-color));
            --text-dim: color-mix(in srgb, var(--text-color) 40%, var(--bg-color));
            --danger: #FF5A5A;
            --s: 1;
            /* --u: one layout unit, ~7 real pixels in every slot (set per breakpoint) */
            --u: 1vw;
            --pad: calc(3 * var(--u));
            --gap: calc(1.4 * var(--u));
            --tile-h: calc(24 * var(--u));
            --tile-w: calc(36 * var(--u));
            --rows: 3;
            --cols: 2;
            --fs: calc(3 * var(--u));
        }

        html { overflow: hidden; }

        body {
            width: calc(100vw * var(--s)); height: calc(100vh * var(--s));
            transform: scale(calc(1 / var(--s)));
            transform-origin: top left;
            overflow: hidden;
            font-family: 'Jost', sans-serif; font-weight: 600;
            background: transparent;
            color: var(--text-color);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Background media (media-selector) */
        .widget-background { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        #media-background {
            position: relative; width: 100%; height: 100%;
            filter: blur(var(--bg-blur, 0px));
            will-change: filter;
            visibility: hidden;
        }
        .position-container { position: absolute; transform-origin: top left; }
        .scale-container { transform-origin: top left; }
        .rotation-container { transform-origin: center center; }
        .rotation-container img, .rotation-container video { display: block; object-fit: contain; }

        .container {
            position: relative; z-index: 1;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            background-color: color-mix(in srgb, var(--bg-color), transparent calc((1 - var(--widget-opacity)) * 100%));
            font-size: var(--fs);
        }

        .widget-title {
            display: none;
            flex: 0 0 auto;
            font-weight: 700;
            font-size: calc(var(--fs) * 0.95);
            text-align: center;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding-top: calc(var(--pad) * 0.6);
            pointer-events: none;
        }
        .container.has-title .widget-title { display: block; }

        /* ---------- Areas and tiles ---------- */
        .areas {
            flex: 1; min-height: 0; min-width: 0;
            display: flex;
            gap: calc(var(--gap) * 2.4);
            padding: var(--pad);
            overflow: auto;
            scrollbar-width: none;
            overscroll-behavior: contain;
        }
        .areas::-webkit-scrollbar { display: none; }
        .container.has-title .areas { padding-top: calc(var(--pad) * 0.6); }

        .areas.more-right { -webkit-mask-image: linear-gradient(to right, black calc(100% - 9 * var(--u)), transparent); }
        .areas.more-down { -webkit-mask-image: linear-gradient(to bottom, black calc(100% - 9 * var(--u)), transparent); }
        .area { display: flex; flex-direction: column; gap: calc(var(--gap) * 0.8); flex: 0 0 auto; }
        .area-name {
            font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.14em;
            color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            line-height: 1.1;
        }
        .area-grid { display: grid; gap: var(--gap); }

        /* Rooms layout: room tiles and the bar shown inside a room */
        .tile.room .tile-name { font-size: 1.15em; font-weight: 700; }
        .nav {
            display: none; flex: 0 0 auto; align-items: center; gap: calc(1.6 * var(--u));
            padding: var(--pad) var(--pad) 0;
        }
        .nav.shown { display: flex; }
        .container.has-title .nav { padding-top: calc(var(--pad) * 0.6); }
        .nav.shown + .areas { padding-top: calc(var(--pad) * 0.7); }
        .nav-back, .nav-btn {
            height: calc(8 * var(--u)); padding: 0 1em; border-radius: calc(4 * var(--u));
            background: var(--tile-bg); display: flex; align-items: center; gap: 0.35em;
            white-space: nowrap; cursor: pointer; flex: 0 0 auto;
            transition: background-color 0.2s, transform 0.12s;
        }
        .nav-btn.on { background: var(--tile-on); }
        .nav-back:active, .nav-btn:active { transform: scale(0.95); }
        .nav-back-icon { width: 1.1em; height: 1.1em; display: block; }
        .nav-back-icon svg { width: 100%; height: 100%; display: block; }
        .nav-titles { flex: 1; min-width: 0; }
        .nav-title { font-weight: 700; font-size: 1.15em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nav-sub { font-weight: 400; font-size: 0.82em; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .tile {
            position: relative;
            height: var(--tile-h);
            min-width: 0;
            border-radius: calc(2 * var(--u));
            background: var(--tile-bg);
            padding: calc(1.8 * var(--u)) calc(2 * var(--u));
            display: flex; flex-direction: column; justify-content: space-between;
            overflow: hidden;
            cursor: pointer;
            transition: background-color 0.25s, transform 0.12s;
        }
        .tile.pressed { transform: scale(0.96); }
        .tile.on { background: var(--tile-on); }
        .tile.unavailable { cursor: default; }
        .tile.unavailable .tile-name, .tile.unavailable .tile-state { color: var(--text-dim); }
        .tile.unavailable .tile-icon { color: var(--text-dim); }
        .tile.pending::after {
            content: ''; position: absolute; inset: 0; border-radius: inherit;
            border: calc(0.35 * var(--u)) solid var(--accent-color);
            animation: pulse 1s ease-in-out infinite;
            pointer-events: none;
        }
        .tile.confirm { background: color-mix(in srgb, var(--danger) 28%, transparent); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

        .tile-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.4em; min-width: 0; }
        .tile-icon { width: 1.7em; height: 1.7em; flex: 0 0 auto; color: var(--text-muted); }
        .tile.on .tile-icon { color: var(--accent-color); }
        .tile-icon svg { width: 100%; height: 100%; display: block; }
        .tile-value {
            font-weight: 700; font-size: 1.25em; line-height: 1; white-space: nowrap;
            color: var(--text-color); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis;
        }
        .tile-value.sensor { color: var(--secondary-color); }
        .tile-value small { font-size: 0.6em; font-weight: 600; margin-left: 0.1em; }
        .tile-bottom { min-width: 0; }
        .tile-name {
            line-height: 1.15; overflow: hidden;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            word-break: break-word;
        }
        .tile-state {

            position: absolute; left: 0; right: 0; bottom: 0; height: calc(0.7 * var(--u));

        }

        /* ---------- Wide slots (HS / HL / HXL): areas flow left to right ---------- */
        @media (min-aspect-ratio: 200/100) {
            :root { --u: 1vh; --pad: calc(3 * var(--u)); --rows: 3; --tile-h: calc(27.5 * var(--u)); --tile-w: calc(37 * var(--u)); --fs: calc(3.2 * var(--u)); }
            .areas { flex-direction: row; overflow-y: hidden; }

        @media (min-aspect-ratio: 2427/1000) and (max-aspect-ratio: 299/100) {

            .area { gap: calc(0.6 * var(--u)); }
            .tile { padding: calc(1.3 * var(--u)) calc(1.6 * var(--u)); }

        @media (max-aspect-ratio: 899/1000) {

        .badge {
            position: absolute; top: calc(1.2 * var(--u)); right: calc(1.6 * var(--u)); z-index: 15;
            display: none; align-items: center; gap: 0.4em;

        .overlay {

        .overlay-icon svg { width: 100%; height: 100%; }
        .overlay-title { text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; font-size: 1.3em; }
        .overlay-hint { color: var(--text-muted); font-weight: 400; max-width: 60em; line-height: 1.35; }

        .toast {

        }

        /* ---------- Detail panel ---------- */
        .panel {
            display: none;
            position: absolute; inset: 0; z-index: 30;

        .panel-icon svg { width: 100%; height: 100%; }
        .panel-titles { flex: 1; min-width: 0; }
        .panel-name { font-weight: 700; font-size: 1.2em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .panel-sub { font-weight: 400; color: var(--text-muted); font-size: 0.85em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .panel-close {
            width: calc(9 * var(--u)); height: calc(9 * var(--u)); flex: 0 0 auto;
            border-radius: 50%; background: var(--tile-bg);

        }
        .panel-row { display: flex; gap: calc(1.6 * var(--u)); align-items: center; justify-content: center; flex-wrap: wrap; }
        .pbtn {
            min-width: calc(14 * var(--u)); height: calc(10 * var(--u));
            padding: 0 1em; border-radius: calc(5 * var(--u));

        .pbtn.on { background: var(--tile-on); }
        .pbtn.round { min-width: calc(12 * var(--u)); width: calc(12 * var(--u)); height: calc(12 * var(--u)); padding: 0; border-radius: 50%; }
        .pbtn.round svg { width: 50%; height: 50%; }
        .pbtn:active { transform: scale(0.94); }
        .big-value { font-weight: 700; font-size: 3.2em; line-height: 1; min-width: 3.2em; text-align: center; color: var(--accent-color); }
        .big-value small { font-size: 0.4em; color: var(--text-color); margin-left: 0.1em; }
        .info-line { color: var(--text-muted); font-weight: 400; text-align: center; }
        .info-big { font-weight: 700; font-size: 2.6em; text-align: center; color: var(--secondary-color); line-height: 1.1; }

        .slider-wrap { display: flex; align-items: center; gap: 1em; }
        .slider-label { width: 6.5em; color: var(--text-muted); font-weight: 400; flex: 0 0 auto; }
        .slider-val { width: 3.6em; text-align: right; font-weight: 700; flex: 0 0 auto; }
        .slider {
            flex: 1; height: calc(10 * var(--u)); border-radius: calc(5 * var(--u));
            background: var(--tile-bg); overflow: hidden; position: relative;
            touch-action: none; cursor: pointer;

        .hidden { display: none !important; }

<body>

    </div>

    <script>
        /* MediaViewer - Corsair common tool for media-selector backgrounds */
        function resolveMediaPath(value) {
            if (!value) return '';
            if (typeof value === 'string') return value;
            if (value.pathToAsset) return value.pathToAsset;
            if (value.path) return value.path;
            if (value.value) return value.value;
            return '';
        }
        function normalizeMediaConfig(rawMedia) {
            var mediaPath = resolveMediaPath(rawMedia);
            if (!mediaPath) return null;
            var base = (rawMedia && typeof rawMedia === 'object') ? rawMedia : {};
            return {
                path: base.pathToAsset || mediaPath,
                baseWidth: Number(base.baseWidth) || 0,
                baseHeight: Number(base.baseHeight) || 0,
                scale: Number.isFinite(Number(base.scale)) ? Number(base.scale) : 1,
                positionX: Number(base.positionX) || 0,
                positionY: Number(base.positionY) || 0,
                angle: Number(base.angle) || 0
            };
        }
        var MediaViewer = (function() {
            var imgExts = ['jpg','jpeg','png','gif','bmp','webp','svg','ico'];
            var vidExts = ['mp4','webm','ogg','mov','avi','mkv'];
            function MV(opts) {
                this.container = opts.container;
                this.pos = null; this.scl = null; this.rot = null;
                this.media = null; this.curPath = null;
            }
            MV.prototype.loadMedia = function(p) {
                var path = p.path; if (!path) { this.clear(); return; }
                var decoded = decodeURIComponent(path);
                if (this.curPath === decoded) { this._transform(p); return; }
                this.clear();
                var ext = decoded.split('.').pop().toLowerCase();
                if (imgExts.indexOf(ext) !== -1) {
                    this.media = document.createElement('img');
                    this.media.src = decoded;
                } else if (vidExts.indexOf(ext) !== -1) {
                    this.media = document.createElement('video');
                    this.media.autoplay = true; this.media.loop = true;
                    this.media.muted = true; this.media.playsInline = true;
                    this.media.src = decoded;
                    this.media.play().catch(function(){});
                } else { return; }
                this.rot = document.createElement('div'); this.rot.className = 'rotation-container';
                this.scl = document.createElement('div'); this.scl.className = 'scale-container';
                this.pos = document.createElement('div'); this.pos.className = 'position-container';
                this.rot.appendChild(this.media);
                this.scl.appendChild(this.rot);
                this.pos.appendChild(this.scl);
                this.container.appendChild(this.pos);
                this.container.style.visibility = 'visible';
                this._transform(p); this.curPath = decoded;
            };
            MV.prototype._transform = function(p) {
                if (!this.pos) return;
                var bw = p.baseWidth || 100, bh = p.baseHeight || 100;
                var s = p.scale !== undefined ? p.scale : 1;
                var ms = Math.min(this.container.clientWidth / bw, this.container.clientHeight / bh);
                this.pos.style.transform = 'translate(' + (p.positionX || 0) * ms + 'px,' + (p.positionY || 0) * ms + 'px)';
                this.scl.style.transform = 'scale(' + s * ms + ')';
                this.rot.style.transform = 'rotate(' + (p.angle || 0) + 'deg)';
            };
            MV.prototype.clear = function() {
                this.container.innerHTML = '';
                this.container.style.visibility = 'hidden';
                this.pos = this.scl = this.rot = this.media = this.curPath = null;
            };
            return MV;
        })();
    </script>

    <script>
        // ================================================================
        // Configuration
        // ================================================================
        var cfg = {
            haUrl: 'http://homeassistant.local:8123',
            haToken: '',
            haLabel: 'xeneon',
            showDevices: 'all',
            layoutMode: 'rooms',
            textColor: '#E0E0E0',
            accentColor: '#FFAE30',
            secondaryColor: '#009BFF',
            bgColor: '#4F5458',
            transparency: 100,
            glassBlur: 0
        };

        var mediaViewer = null;
        var connKey = '';            // url|token|label of the live connection
        var ha = null;               // active HaConnection or DemoConnection
        var model = {                // what the widget shows
            areas: [],               // [{id, name, entities: [entity_id]}]
            entities: {},            // entity_id -> {id, areaName, name}

            script: '<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>',

            water: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
            button: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
            dot: '<circle cx="12" cy="12" r="4"/>',
            home: '<path d="M3 11l9-7 9 7M5 9.5V20h5v-6h4v6h5V9.5"/>',

            x: '<path d="M6 6l12 12M18 6L6 18"/>',

        function svg(name) {
            return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || ICONS.dot) + '</svg>';
        }

        // ================================================================
        // Preview scale detection (iCUE previews render smaller but keep
        // the slot aspect ratio; scale the body so sizes match)
        // ================================================================
        var ACTUAL_SIZES = [
            { minA: 3.5,  maxA: 4.0,  w: 2537, h: 697  }, // HXL
            { minA: 2.41, maxA: 2.45, w: 841,  h: 345  }, // HS
            { minA: 2.0,  maxA: 2.5,  w: 1689, h: 697  }, // HL
            { minA: 1.5,  maxA: 1.8,  w: 697,  h: 417  }, // VS
            { minA: 1.15, maxA: 1.25, w: 841,  h: 697  }, // HM
            { minA: 0.8,  maxA: 0.9,  w: 697,  h: 841  }, // VM
            { minA: 0.38, maxA: 0.45, w: 697,  h: 1689 }, // VL
            { minA: 0.25, maxA: 0.3,  w: 697,  h: 2537 }  // VXL
        ];

        function updatePreviewScale() {
            var w = window.innerWidth, h = window.innerHeight;
            var aspect = w / h, scale = 1;
            for (var i = 0; i < ACTUAL_SIZES.length; i++) {
                var s = ACTUAL_SIZES[i];
                if (aspect >= s.minA && aspect <= s.maxA) { scale = s.w / w; break; }
            }
            if (scale < 1.1) scale = 1;
            document.documentElement.style.setProperty('--s', scale.toFixed(4));
        }

        // ================================================================
        // Settings
        // ================================================================
        function readSettings() {
            if (typeof haUrl !== 'undefined') cfg.haUrl = String(haUrl || '').trim();
            if (typeof haToken !== 'undefined') cfg.haToken = String(haToken || '').trim();
            if (typeof haLabel !== 'undefined') cfg.haLabel = String(haLabel || '').trim();
            if (typeof showDevices !== 'undefined') cfg.showDevices = showDevices === 'label' ? 'label' : 'all';
            if (typeof layoutMode !== 'undefined') cfg.layoutMode = layoutMode === 'flat' ? 'flat' : 'rooms';
            if (typeof textColor !== 'undefined') cfg.textColor = textColor;
            if (typeof accentColor !== 'undefined') cfg.accentColor = accentColor;
            if (typeof secondaryColor !== 'undefined') cfg.secondaryColor = secondaryColor;
            if (typeof backgroundColor !== 'undefined') cfg.bgColor = backgroundColor;
            if (typeof transparency !== 'undefined') cfg.transparency = Number(transparency) || 0;
            if (typeof glassBlur !== 'undefined') cfg.glassBlur = Number(glassBlur) || 0;
            if (typeof customTitle !== 'undefined') {
                document.getElementById('widget-title').textContent = customTitle;
                document.getElementById('container').classList.toggle('has-title', !!customTitle);
            }
            applySettings();
        }

        function applySettings() {
            var root = document.documentElement;
            root.style.setProperty('--text-color', cfg.textColor);
            root.style.setProperty('--accent-color', cfg.accentColor);
            root.style.setProperty('--secondary-color', cfg.secondaryColor);
            root.style.setProperty('--bg-color', cfg.bgColor);
            root.style.setProperty('--widget-opacity', cfg.transparency / 100);
            root.style.setProperty('--bg-blur', cfg.glassBlur + 'px');

            if (mediaViewer) {
                var raw = (typeof backgroundMedia !== 'undefined') ? backgroundMedia : null;
                var media = normalizeMediaConfig(raw);
                if (media) mediaViewer.loadMedia(media); else mediaViewer.clear();
            }

            var key = cfg.haUrl + '|' + cfg.haToken + '|' + cfg.haLabel + '|' + cfg.showDevices;
            if (key !== connKey) {
                connKey = key;
                startConnection();
            } else if (model.ready) {
                if (cfg.layoutMode !== 'rooms') currentArea = null;
                buildModel();
                renderAll();
            }
        }

        // ================================================================
        // Connection management
        // ================================================================
        function isDemo() { return cfg.haUrl.toLowerCase() === 'demo'; }

        function normalizeUrl(u) {
            u = u.replace(/\/+$/, '');
            if (!/^https?:\/\//i.test(u)) u = 'http://' + u;
            return u;
        }

        function startConnection() {
            if (ha) { ha.close(); ha = null; }
            model.ready = false;
            model.areas = []; model.entities = {}; model.states = {};
            registry = null;
            currentArea = null;
            closePanel();
            renderAll();

            if (isDemo()) {
                ha = new DemoConnection();
            } else if (!cfg.haUrl || !cfg.haToken) {
                showOverlay('home', 'Connect Home Assistant',
                    'Enter your Home Assistant URL and a long-lived access token in the widget settings. Create the token in Home Assistant under Profile > Security.');
                return;
            } else {
                ha = new HaConnection(normalizeUrl(cfg.haUrl), cfg.haToken);
            }
            showOverlay('home', 'Connecting', isDemo() ? 'Demo mode' : normalizeUrl(cfg.haUrl));
            ha.start();
        }

        // Real Home Assistant WebSocket API connection.
        function HaConnection(url, token) {
            this.url = url.replace(/^http/i, 'ws') + '/api/websocket';
            this.displayUrl = url;
            this.token = token;
            this.ws = null;
            this.nextId = 1;
            this.waiting = {};
            this.closed = false;
            this.retryMs = 2000;
            this.retryTimer = null;
            this.pingTimer = null;
            this.lastPong = 0;
            this.everConnected = false;
            this.authFailed = false;
        }
        HaConnection.prototype.start = function() {
            var self = this;
            if (this.closed) return;
            try {
                this.ws = new WebSocket(this.url);
            } catch (e) {
                showOverlay('alert', 'Invalid URL', this.displayUrl);
                return;
            }
            this.ws.onmessage = function(ev) { self.onMessage(ev); };
            this.ws.onclose = function() { self.onClose(); };
            this.ws.onerror = function() {};
        };
        HaConnection.prototype.send = function(msg) {
            if (!this.ws || this.ws.readyState !== 1) return Promise.reject(new Error('Not connected'));
            var self = this;
            var id = this.nextId++;
            msg.id = id;
            return new Promise(function(resolve, reject) {
                self.waiting[id] = { resolve: resolve, reject: reject };
                self.ws.send(JSON.stringify(msg));
            });
        };
        HaConnection.prototype.onMessage = function(ev) {
            var msg;
            try { msg = JSON.parse(ev.data); } catch (e) { return; }
            var self = this;
            if (msg.type === 'auth_required') {
                this.ws.send(JSON.stringify({ type: 'auth', access_token: this.token }));
            } else if (msg.type === 'auth_invalid') {
                this.authFailed = true;
                this.closed = true;
                showOverlay('lock', 'Access token rejected',
                    'Create a new long-lived access token in Home Assistant (Profile > Security) and paste it into the widget settings.');
                this.ws.close();
            } else if (msg.type === 'auth_ok') {
                this.everConnected = true;
                this.entitiesSubId = null;
                this.registryIds = {};
                this.retryMs = 2000;
                this.lastPong = Date.now();
                this.startPing();
                onConnected(this);
            } else if (msg.type === 'result' || msg.type === 'pong') {
                if (msg.type === 'pong') this.lastPong = Date.now();
                var w = this.waiting[msg.id];
                if (w) {
                    delete this.waiting[msg.id];
                    if (msg.type === 'pong' || msg.success) w.resolve(msg.result);
                    else w.reject(new Error((msg.error && msg.error.message) || 'Request failed'));
                }
            } else if (msg.type === 'event') {
                if (msg.id === this.entitiesSubId) onEntitiesEvent(msg.event);
                else if (this.registryIds[msg.id]) scheduleRegistryReload();
            }
        };
        HaConnection.prototype.startPing = function() {
            var self = this;
            clearInterval(this.pingTimer);
            this.pingTimer = setInterval(function() {
                if (Date.now() - self.lastPong > 75000) { try { self.ws.close(); } catch (e) {} return; }
                self.send({ type: 'ping' }).catch(function() {});
            }, 30000);
        };
        HaConnection.prototype.onClose = function() {
            var self = this;
            clearInterval(this.pingTimer);
            for (var id in this.waiting) this.waiting[id].reject(new Error('Disconnected'));
            this.waiting = {};
            if (this.closed) return;
            if (model.ready) {
                showBadge('Reconnecting');
            } else {
                showOverlay('alert', "Can't reach Home Assistant",
                    this.displayUrl + ' - retrying in ' + Math.round(this.retryMs / 1000) + 's. Check the URL and that this PC can reach it.');
            }
            this.retryTimer = setTimeout(function() { self.start(); }, this.retryMs);
            this.retryMs = Math.min(this.retryMs * 2, 30000);
        };
        HaConnection.prototype.close = function() {
            this.closed = true;
            clearTimeout(this.retryTimer);
            clearInterval(this.pingTimer);
            if (this.ws) { try { this.ws.close(); } catch (e) {} }
        };
        // send() assigns ids synchronously, so nextId - 1 is the id of the request just sent.
        HaConnection.prototype.subscribeEntities = function(ids) {
            var p = this.send({ type: 'subscribe_entities', entity_ids: ids });
            this.entitiesSubId = this.nextId - 1;
            return p;
        };
        HaConnection.prototype.unsubscribeEntities = function() {
            if (!this.entitiesSubId) return Promise.resolve();
            var sub = this.entitiesSubId;
            this.entitiesSubId = null;
            return this.send({ type: 'unsubscribe_events', subscription: sub }).catch(function() {});
        };
        // One subscription per registry; any change triggers a debounced reload.
        HaConnection.prototype.subscribeRegistry = function() {
            var self = this;
            var types = ['entity_registry_updated', 'device_registry_updated', 'area_registry_updated', 'label_registry_updated'];
            return Promise.all(types.map(function(t) {
                var p = self.send({ type: 'subscribe_events', event_type: t });
                self.registryIds[self.nextId - 1] = true;
                return p.catch(function() {});
            }));
        };
        HaConnection.prototype.callService = function(domain, service, data, entityId) {
            return this.send({
                type: 'call_service', domain: domain, service: service,
                service_data: data || {}, target: { entity_id: entityId }
            });
        };

        var registry = null;
        var registryReloadTimer = null;

        function onConnected(conn) {
            hideBadge();
            loadAll(conn).then(function() {
                if (conn === ha) return conn.subscribeRegistry();
            });
        }

        function loadAll(conn) {
            return Promise.all([
                conn.send({ type: 'get_config' }),
                conn.send({ type: 'config/area_registry/list' }),
                conn.send({ type: 'config/device_registry/list' }),
                conn.send({ type: 'config/entity_registry/list' }),
                conn.send({ type: 'config/label_registry/list' }).catch(function() { return []; })
            ]).then(function(r) {
                if (conn !== ha) return;
                var config = r[0] || {};
                model.tempUnit = (config.unit_system && config.unit_system.temperature) || '°F';
                registry = { areas: r[1] || [], devices: r[2] || [], entities: r[3] || [], labels: r[4] || [] };
                buildModel();
                var ids = Object.keys(model.entities);
                if (!ids.length) { model.ready = true; renderAll(); return; }
                model.ready = true;
                return conn.subscribeEntities(ids).then(function() { renderAll(); });
            }).catch(function(err) {
                if (conn !== ha) return;
                showOverlay('alert', 'Home Assistant error', err.message || String(err));
            });
        }

        // Labels, areas or devices changed: reload and re-subscribe to the new entity list.
        function scheduleRegistryReload() {
            clearTimeout(registryReloadTimer);
            registryReloadTimer = setTimeout(function() {
                var conn = ha;
                if (!conn || !conn.ws || conn.ws.readyState !== 1) return;
                conn.unsubscribeEntities().then(function() {
                    model.states = {};
                    return loadAll(conn);
                });
            }, 1500);
        }

        // ================================================================
        // Model: which entities to show, grouped by area
        // ================================================================
        var DOMAIN_ORDER = ['light', 'switch', 'fan', 'climate', 'cover', 'lock', 'media_player', 'input_boolean',
            'humidifier', 'siren', 'scene', 'script', 'automation', 'button', 'input_button', 'binary_sensor', 'sensor'];

        // Shown in "All" mode without a label: things you control, not readings or plumbing.
        var ALL_DOMAINS = { light: 1, switch: 1, fan: 1, climate: 1, cover: 1, lock: 1, media_player: 1,
            humidifier: 1, siren: 1, valve: 1, water_heater: 1, vacuum: 1, scene: 1 };

        function domainOf(id) { return id.split('.')[0]; }

        function buildModel() {
            if (!registry) return;
            var wanted = (cfg.haLabel || '').toLowerCase();
            var labelIds = {};
            registry.labels.forEach(function(l) {
                if ((l.name || '').toLowerCase() === wanted || (l.label_id || '').toLowerCase() === wanted) labelIds[l.label_id] = true;
            });
            model.labelFound = Object.keys(labelIds).length > 0;

            var hasLabel = function(list) {
                if (!list) return false;
                for (var i = 0; i < list.length; i++) if (labelIds[list[i]]) return true;
                return false;
            };

            var devices = {};
            registry.devices.forEach(function(d) { devices[d.id] = d; });
            var areaNames = {};
            registry.areas.forEach(function(a) { areaNames[a.area_id] = a.name; });

            var chosen = {};
            registry.entities.forEach(function(e) {
                if (e.disabled_by || e.hidden_by) return;
                var dev = e.device_id ? devices[e.device_id] : null;
                var direct = hasLabel(e.labels);
                // A labeled device contributes its primary entities, not config/diagnostic ones.
                var viaDevice = dev && hasLabel(dev.labels) && !e.entity_category;
                var everyday = cfg.showDevices === 'all' && !e.entity_category && ALL_DOMAINS[domainOf(e.entity_id)];
                if (!direct && !viaDevice && !everyday) return;
                var areaId = e.area_id || (dev && dev.area_id) || null;
                chosen[e.entity_id] = { id: e.entity_id, areaId: areaId, regName: e.name || null };
            });

            var byArea = {};
            Object.keys(chosen).forEach(function(id) {
                var key = chosen[id].areaId || '_other';
                (byArea[key] = byArea[key] || []).push(id);
            });

            var areas = [];
            registry.areas.forEach(function(a) {
                if (byArea[a.area_id]) areas.push({ id: a.area_id, name: a.name, entities: byArea[a.area_id] });
            });
            if (byArea._other) areas.push({ id: '_other', name: 'Other', entities: byArea._other });

            model.entities = {};
            Object.keys(chosen).forEach(function(id) {
                var c = chosen[id];
                model.entities[id] = { id: id, areaId: c.areaId || '_other', areaName: c.areaId ? areaNames[c.areaId] : '', regName: c.regName };
            });
            areas.forEach(function(a) { a.entities.sort(compareEntities); });
            model.areas = areas;
            if (currentArea && !areaById(currentArea)) currentArea = null;
        }

        function areaById(id) {
            for (var i = 0; i < model.areas.length; i++) if (model.areas[i].id === id) return model.areas[i];
            return null;
        }

        function compareEntities(a, b) {
            var da = DOMAIN_ORDER.indexOf(domainOf(a)), db = DOMAIN_ORDER.indexOf(domainOf(b));
            if (da < 0) da = 99; if (db < 0) db = 99;
            if (da !== db) return da - db;
            return displayName(a).localeCompare(displayName(b));
        }

        // Friendly name, minus a leading area name ("Kitchen Ceiling" in Kitchen -> "Ceiling").
        function displayName(id) {
            var ent = model.entities[id] || {};
            var st = model.states[id];
            var name = ent.regName || (st && st.a && st.a.friendly_name) || id.split('.')[1].replace(/_/g, ' ');
            var area = ent.areaName || '';
            if (area && name.toLowerCase().indexOf(area.toLowerCase() + ' ') === 0 && name.length > area.length + 1) {
                name = name.slice(area.length + 1);
                name = name.charAt(0).toUpperCase() + name.slice(1);
            }
            return name;
        }

        // subscribe_entities compressed state stream
        function onEntitiesEvent(ev) {
            var changed = [];
            if (ev.a) {
                Object.keys(ev.a).forEach(function(id) {
                    var x = ev.a[id];
                    model.states[id] = { s: x.s, a: x.a || {}, lc: toMs(x.lc) };
                    changed.push(id);
                });
            }
            if (ev.c) {
                Object.keys(ev.c).forEach(function(id) {
                    var st = model.states[id];
                    if (!st) return;
                    var d = ev.c[id];
                    if (d['+']) {
                        if (d['+'].s !== undefined) st.s = d['+'].s;
                        if (d['+'].a) Object.keys(d['+'].a).forEach(function(k) { st.a[k] = d['+'].a[k]; });
                        if (d['+'].lc !== undefined) st.lc = toMs(d['+'].lc);
                    }
                    if (d['-'] && d['-'].a) d['-'].a.forEach(function(k) { delete st.a[k]; });
                    changed.push(id);
                });
            }
            if (ev.r) ev.r.forEach(function(id) { delete model.states[id]; changed.push(id); });

            if (ev.a && Object.keys(ev.a).length > 1) { renderAll(); }
            else changed.forEach(function(id) { clearPending(id); updateTile(id); });
            if (cfg.layoutMode === 'rooms') {
                var touched = {};
                changed.forEach(function(id) { var e = model.entities[id]; if (e) touched[e.areaId] = true; });
                Object.keys(touched).forEach(updateRoomTile);
                if (currentArea && touched[currentArea]) renderNav();
            }
            if (panelEntity && changed.indexOf(panelEntity) !== -1) renderPanel();
        }
        function toMs(t) { return t ? (t > 1e12 ? t : t * 1000) : Date.now(); }

        // ================================================================
        // Entity presentation
        // ================================================================
        var ON_STATES = { on: 1, open: 1, opening: 1, closing: 1, unlocked: 1, playing: 1, home: 1, heat: 1, cool: 1, heat_cool: 1, auto: 1, dry: 1, fan_only: 1, cleaning: 1 };
        var BINARY_TEXT = {
            door: ['Closed', 'Open'], garage_door: ['Closed', 'Open'], window: ['Closed', 'Open'], opening: ['Closed', 'Open'],
            motion: ['Clear', 'Motion'], occupancy: ['Clear', 'Detected'], presence: ['Away', 'Home'],
            moisture: ['Dry', 'Wet'], smoke: ['Clear', 'Smoke'], gas: ['Clear', 'Gas'], lock: ['Locked', 'Unlocked'],
            battery: ['Normal', 'Low'], plug: ['Unplugged', 'Plugged in'], connectivity: ['Offline', 'Online']
        };

        function titleCase(s) {
            s = String(s || '').replace(/_/g, ' ');
            return s.charAt(0).toUpperCase() + s.slice(1);
        }

        function fmtNum(v) {
            var n = Number(v);
            if (!isFinite(n)) return String(v);
            if (Math.abs(n) >= 100) return String(Math.round(n));
            return String(Math.round(n * 10) / 10);
        }

        function iconFor(id, st) {
            var d = domainOf(id), a = (st && st.a) || {};
            var dc = a.device_class;
            switch (d) {
                case 'light': return 'light';
                case 'switch': return dc === 'outlet' ? 'plug' : 'power';
                case 'input_boolean': return 'power';
                case 'fan': return 'fan';
                case 'climate': return 'thermostat';
                case 'cover': return 'cover';
                case 'lock': return st && st.s === 'unlocked' ? 'unlock' : 'lock';
                case 'media_player': return 'media';
                case 'scene': return 'scene';
                case 'script': return 'script';
                case 'automation': return 'automation';
                case 'button': case 'input_button': return 'button';
                case 'binary_sensor':
                    if (dc === 'door' || dc === 'garage_door' || dc === 'opening') return 'door';
                    if (dc === 'window') return 'window';
                    if (dc === 'motion' || dc === 'occupancy' || dc === 'presence') return 'motion';
                    if (dc === 'moisture') return 'water';
                    return 'dot';
                case 'sensor':
                    if (dc === 'temperature') return 'thermostat';
                    if (dc === 'humidity') return 'water';
                    return 'sensor';
            }
            return 'dot';
        }

        // -> {on, value(html), state(text), bar(0-100|null), sensor(bool)}
        function describe(id) {
            var st = model.states[id];
            var d = domainOf(id);
            if (!st) return { on: false, value: '', state: 'Loading', bar: null, unavailable: true };
            var s = st.s, a = st.a || {};
            if (s === 'unavailable' || s === 'unknown') return { on: false, value: '', state: titleCase(s), bar: null, unavailable: true };
            var out = { on: !!ON_STATES[s], value: '', state: titleCase(s), bar: null, sensor: false };

            if (d === 'light') {
                if (s === 'on' && a.brightness != null) {
                    var pct = Math.max(1, Math.round(a.brightness / 2.55));
                    out.value = pct + '<small>%</small>';
                    out.bar = pct;
                }
            } else if (d === 'fan') {
                if (s === 'on' && a.percentage != null) { out.value = a.percentage + '<small>%</small>'; out.bar = a.percentage; }
            } else if (d === 'cover') {
                if (a.current_position != null) {
                    out.value = a.current_position + '<small>%</small>';
                    out.bar = a.current_position;
                }
                out.on = s === 'open' || s === 'opening' || s === 'closing';
            } else if (d === 'climate') {
                var unit = model.tempUnit;
                if (a.current_temperature != null) out.value = fmtNum(a.current_temperature) + '<small>°</small>';
                var target = a.temperature != null ? fmtNum(a.temperature) + '°'
                    : (a.target_temp_low != null ? fmtNum(a.target_temp_low) + '-' + fmtNum(a.target_temp_high) + '°' : '');
                var action = a.hvac_action ? titleCase(a.hvac_action) : titleCase(s);
                out.state = s === 'off' ? 'Off' : action + (target ? ' · ' + target : '');
                out.on = s !== 'off';
            } else if (d === 'lock') {
                out.on = s === 'unlocked' || s === 'open';
                if (lockConfirm[id]) out.state = 'Tap again to unlock';
                if (s === 'jammed') out.state = 'Jammed';
            } else if (d === 'media_player') {
                if (a.media_title) out.state = (s === 'playing' ? '' : titleCase(s) + ' · ') + a.media_title + (a.media_artist ? ' - ' + a.media_artist : '');
                out.on = s === 'playing' || s === 'on';
                if (a.volume_level != null && out.on) out.value = Math.round(a.volume_level * 100) + '<small>%</small>';
            } else if (d === 'sensor') {
                var isNum = s !== '' && isFinite(Number(s));
                out.value = (isNum ? fmtNum(s) : titleCase(s)) + (a.unit_of_measurement ? '<small>' + escapeHtml(a.unit_of_measurement) + '</small>' : '');
                out.state = 'Updated ' + ago(st.lc);
                out.sensor = true; out.on = false;
            } else if (d === 'binary_sensor') {
                var pair = BINARY_TEXT[a.device_class];
                out.state = pair ? pair[s === 'on' ? 1 : 0] : (s === 'on' ? 'On' : 'Off');
            } else if (d === 'scene' || d === 'button' || d === 'input_button') {
                out.on = false;
                out.state = d === 'scene' ? 'Scene' : 'Press';
            } else if (d === 'script') {
                out.state = s === 'on' ? 'Running' : 'Script';
            } else if (d === 'automation') {
                out.state = s === 'on' ? 'Enabled' : 'Disabled';
            }
            return out;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        // ================================================================
        // Rendering
        // ================================================================
        function renderAll() {
            var root = document.getElementById('areas');
            if (!model.ready) { root.innerHTML = ''; return; }

            if (!model.areas.length) {
                root.innerHTML = '';
                renderNav();
                var lbl = cfg.haLabel || '(none)';
                if (cfg.showDevices === 'all') {
                    showOverlay('home', 'No devices found',
                        'Home Assistant has no visible lights, switches, climate, covers, locks, media players or scenes. Add the "' + lbl + '" label to anything else you want here.');
                } else if (!model.labelFound) {
                    showOverlay('home', 'No label "' + lbl + '"',
                        'In Home Assistant, create a label called "' + lbl + '" and add it to the devices or entities you want on this widget. Or change Device Label in the widget settings.');
                } else {
                    showOverlay('home', 'Nothing labeled yet',
                        'Add the "' + lbl + '" label to devices or entities in Home Assistant (Settings > Devices & services). They appear here right away.');
                }
                return;
            }
            hideOverlay();

            renderNav();
            document.getElementById('container').classList.toggle('rooms-mode', cfg.layoutMode === 'rooms');
            var html = '';
            if (cfg.layoutMode === 'rooms' && !currentArea) {
                html = '<div class="area"><div class="area-grid">';
                model.areas.forEach(function(area) {
                    html += '<div class="tile room" data-area="' + escapeHtml(area.id) + '"></div>';
                });
                html += '</div></div>';
                root.innerHTML = html;
                model.areas.forEach(function(area) { updateRoomTile(area.id); });
                root.scrollLeft = 0; root.scrollTop = 0;
                updateScrollHint();
                return;
            }
            var shown = cfg.layoutMode === 'rooms' ? [areaById(currentArea)] : model.areas;
            shown.forEach(function(area) {
                html += '<div class="area">';
                if (cfg.layoutMode !== 'rooms') html += '<div class="area-name">' + escapeHtml(area.name) + '</div>';
                html += '<div class="area-grid">';
                area.entities.forEach(function(id) {
                    html += '<div class="tile" data-id="' + escapeHtml(id) + '"></div>';
                });
                html += '</div></div>';
            });
            root.innerHTML = html;
            shown.forEach(function(area) { area.entities.forEach(updateTile); });
            updateScrollHint();
        }

        // ---------- Rooms layout ----------
        function roomStats(area) {
            var lightsOn = [], othersOn = 0, temp = null, climateTemp = null;
            area.entities.forEach(function(id) {
                var st = model.states[id];
                if (!st) return;
                var d = domainOf(id), a = st.a || {};
                if (d === 'light' && st.s === 'on') lightsOn.push(id);
                else if (d === 'sensor' && a.device_class === 'temperature' && temp == null && isFinite(Number(st.s))) temp = Number(st.s);
                else if (d === 'climate') { if (a.current_temperature != null && climateTemp == null) climateTemp = a.current_temperature; }
                else if (d !== 'sensor' && d !== 'binary_sensor' && d !== 'scene' && describe(id).on) othersOn++;
            });
            if (temp == null) temp = climateTemp;
            var parts = [];
            if (lightsOn.length) parts.push(lightsOn.length + (lightsOn.length === 1 ? ' light on' : ' lights on'));
            if (othersOn) parts.push(othersOn + ' active');
            var lights = area.entities.filter(function(id) { return domainOf(id) === 'light'; });
            return {
                lightsOn: lightsOn, lights: lights,
                on: lightsOn.length + othersOn > 0,
                summary: parts.length ? parts.join(' · ') : (area.entities.length + (area.entities.length === 1 ? ' device' : ' devices')),
                temp: temp
            };
        }

        function roomTileEl(areaId) {
            return document.querySelector('.tile.room[data-area="' + (window.CSS && CSS.escape ? CSS.escape(areaId) : areaId) + '"]');
        }

        function updateRoomTile(areaId) {
            var el = roomTileEl(areaId), area = areaById(areaId);
            if (!el || !area) return;
            var r = roomStats(area);
            el.classList.toggle('on', r.on);
            el.innerHTML =
                '<div class="tile-top"><span class="tile-icon">' + svg(areaId === '_other' ? 'dot' : 'home') + '</span>' +
                '<span class="tile-value sensor">' + (r.temp != null ? fmtNum(r.temp) + '<small>°</small>' : '') + '</span></div>' +
                '<div class="tile-bottom"><div class="tile-name">' + escapeHtml(area.name) + '</div>' +
                '<div class="tile-state">' + escapeHtml(r.summary) + '</div></div>';
        }

        function renderNav() {
            var nav = document.getElementById('nav');
            var area = cfg.layoutMode === 'rooms' && currentArea ? areaById(currentArea) : null;
            nav.classList.toggle('shown', !!area);
            if (!area) return;
            var r = roomStats(area);
            document.getElementById('nav-title').textContent = area.name;
            document.getElementById('nav-sub').textContent = r.summary + (r.temp != null ? ' · ' + fmtNum(r.temp) + '°' : '');
            var btn = document.getElementById('nav-lights');
            btn.classList.toggle('hidden', !r.lights.length);
            btn.classList.toggle('on', r.lightsOn.length > 0);
            btn.querySelector('span').textContent = r.lightsOn.length ? 'Lights off' : 'Lights on';
        }

        function openArea(id) {
            currentArea = id;
            closePanel();
            renderAll();
            bumpHome();
        }
        function goHome() {
            if (!currentArea) return;
            currentArea = null;
            closePanel();
            renderAll();
        }
        // Rooms layout drifts back to the room list after two idle minutes.
        function bumpHome() {
            clearTimeout(homeTimer);
            if (cfg.layoutMode === 'rooms' && currentArea) homeTimer = setTimeout(goHome, 120000);
        }

        function areaLights(areaId, on) {
            var area = areaById(areaId);
            if (!area || !ha) return;
            var r = roomStats(area);
            var ids = on ? r.lights : r.lightsOn;
            if (!ids.length) return;
            ids.forEach(setPending);
            ha.callService('light', on ? 'turn_on' : 'turn_off', null, ids).catch(function(err) {
                ids.forEach(function(id) { clearPending(id); updateTile(id); });
                toast(area.name + ': ' + (err.message || 'failed'));
            });
        }

        // Fade the far edge while more tiles are off-screen.
        function updateScrollHint() {
            var el = document.getElementById('areas');
            var right = el.scrollWidth - el.clientWidth - el.scrollLeft > 4;
            var down = el.scrollHeight - el.clientHeight - el.scrollTop > 4;
            el.classList.toggle('more-right', right);
            el.classList.toggle('more-down', down && !right);
        }

        function tileEl(id) {
            return document.querySelector('.tile[data-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
        }

        function updateTile(id) {
            var el = tileEl(id);
            if (!el) return;
            var st = model.states[id];
            var info = describe(id);
            el.classList.toggle('on', info.on && !info.unavailable);
            el.classList.toggle('unavailable', !!info.unavailable);
            el.classList.toggle('pending', !!pending[id]);
            el.classList.toggle('confirm', !!lockConfirm[id]);
            el.innerHTML =
                '<div class="tile-top"><span class="tile-icon">' + svg(iconFor(id, st)) + '</span>' +
                '<span class="tile-value' + (info.sensor ? ' sensor' : '') + '">' + info.value + '</span></div>' +
                '<div class="tile-bottom"><div class="tile-name">' + escapeHtml(displayName(id)) + '</div>' +
                '<div class="tile-state">' + escapeHtml(info.state) + '</div></div>' +
                (info.bar != null && info.on ? '<div class="tile-bar"><span style="width:' + info.bar + '%"></span></div>' : '');
        }

        function showOverlay(icon, title, hint) {
            document.getElementById('overlay-icon').innerHTML = svg(icon);
            document.getElementById('overlay-title').textContent = title;
            document.getElementById('overlay-hint').textContent = hint || '';
            document.getElementById('overlay').classList.add('shown');
        }
        function hideOverlay() { document.getElementById('overlay').classList.remove('shown'); }
        function showBadge(text) {
            document.getElementById('badge-text').textContent = text;
            document.getElementById('badge').classList.add('shown');
        }
        function hideBadge() { document.getElementById('badge').classList.remove('shown'); }

        var toastTimer = null;
        function toast(msg) {
            var el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('shown');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() { el.classList.remove('shown'); }, 3500);
        }

        // ================================================================
        // Actions
        // ================================================================
        function call(domain, service, data, id, expectChange) {
            if (!ha) return;
            if (expectChange) setPending(id);
            ha.callService(domain, service, data, id).catch(function(err) {
                clearPending(id); updateTile(id);
                toast(displayName(id) + ': ' + (err.message || 'failed'));
            });
        }

        function setPending(id) {
            clearTimeout(pending[id]);
            pending[id] = setTimeout(function() { delete pending[id]; updateTile(id); }, 8000);
            updateTile(id);
        }
        function clearPending(id) {
            if (pending[id]) { clearTimeout(pending[id]); delete pending[id]; }
        }

        var TOGGLE_DOMAINS = { light: 1, switch: 1, input_boolean: 1, fan: 1, automation: 1, siren: 1, humidifier: 1 };

        function onTap(id) {
            var st = model.states[id];
            if (!st || st.s === 'unavailable') return;
            var d = domainOf(id);
            if (TOGGLE_DOMAINS[d]) return call(d, 'toggle', null, id, true);
            if (d === 'cover') return call('cover', 'toggle', null, id, true);
            if (d === 'scene') { flashTile(id); return call('scene', 'turn_on', null, id, false); }
            if (d === 'script') { flashTile(id); return call('script', 'turn_on', null, id, false); }
            if (d === 'button' || d === 'input_button') { flashTile(id); return call(d, 'press', null, id, false); }
            if (d === 'media_player') return call('media_player', 'media_play_pause', null, id, true);
            if (d === 'lock') {
                if (st.s === 'unlocked' || st.s === 'open') return call('lock', 'lock', null, id, true);
                if (lockConfirm[id]) {
                    clearTimeout(lockConfirm[id]); delete lockConfirm[id];
                    return call('lock', 'unlock', null, id, true);
                }
                lockConfirm[id] = setTimeout(function() { delete lockConfirm[id]; updateTile(id); }, 3000);
                return updateTile(id);
            }
            openPanel(id);
        }

        function flashTile(id) {
            var el = tileEl(id);
            if (!el) return;
            el.classList.add('on');
            setTimeout(function() { updateTile(id); }, 700);
        }

        // Tap vs. long-press vs. scroll, by pointer movement and duration.
        function attachTileHandlers() {
            var root = document.getElementById('areas');
            var press = null;
            root.addEventListener('pointerdown', function(e) {
                var tile = e.target.closest('.tile');
                if (!tile) return;
                var id = tile.getAttribute('data-id');
                var areaId = tile.getAttribute('data-area');
                press = { id: id, area: areaId, x: e.clientX, y: e.clientY, tile: tile, long: false };
                tile.classList.add('pressed');
                press.timer = setTimeout(function() {
                    if (!press) return;
                    press.long = true;
                    tile.classList.remove('pressed');
                    if (areaId) openRoomPanel(areaId); else openPanel(id);
                }, 550);
            });
            root.addEventListener('pointermove', function(e) {
                if (!press) return;
                if (Math.abs(e.clientX - press.x) > 12 || Math.abs(e.clientY - press.y) > 12) cancelPress();
            });
            function cancelPress() {
                if (!press) return;
                clearTimeout(press.timer);
                press.tile.classList.remove('pressed');
                press = null;
            }
            root.addEventListener('pointerup', function() {
                if (!press) return;
                var p = press;
                cancelPress();
                if (p.long) return;
                if (p.area) openArea(p.area); else onTap(p.id);
            });
            root.addEventListener('pointercancel', cancelPress);
            root.addEventListener('pointerleave', cancelPress);
            root.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            // Mouse wheel scrolls the horizontal layouts sideways.
            root.addEventListener('wheel', function(e) {
                if (root.scrollWidth > root.clientWidth && Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                    root.scrollLeft += e.deltaY;
                    e.preventDefault();
                }
            }, { passive: false });
        }

        // ================================================================
        // Detail panel
        // ================================================================
        function openPanel(id) {
            panelEntity = id;
            document.getElementById('panel').classList.add('shown');
            renderPanel();
            bumpPanelIdle();
        }
        function openRoomPanel(areaId) {
            var area = areaById(areaId);
            if (!area) return;
            panelEntity = null;
            panelArea = areaId;
            var r = roomStats(area);
            document.getElementById('panel-icon').innerHTML = svg('home');
            document.getElementById('panel-name').textContent = area.name;
            document.getElementById('panel-sub').textContent = r.summary;
            var h = '<div class="panel-row">';
            if (r.lights.length) h += pbtn('room-on', 'All lights on', 'light', r.lightsOn.length === r.lights.length) + pbtn('room-off', 'All lights off', 'power', false);
            h += pbtn('room-open', 'Open room', 'home', false) + '</div>';
            document.getElementById('panel-body').innerHTML = h;
            document.getElementById('panel').classList.add('shown');
            bumpPanelIdle();
        }
        function closePanel() {
            panelEntity = null;
            panelArea = null;
            clearTimeout(panelIdleTimer);
            document.getElementById('panel').classList.remove('shown');
        }
        function bumpPanelIdle() {
            clearTimeout(panelIdleTimer);
            panelIdleTimer = setTimeout(closePanel, 30000);
        }

        var sliderDragging = false;

        function renderPanel() {
            var id = panelEntity;
            if (!id) return;
            if (sliderDragging) return;   // don't fight the user's finger
            var st = model.states[id];
            var a = (st && st.a) || {};
            var d = domainOf(id);
            var info = describe(id);
            document.getElementById('panel-icon').innerHTML = svg(iconFor(id, st));
            document.getElementById('panel-name').textContent = displayName(id);
            var area = (model.entities[id] || {}).areaName;
            document.getElementById('panel-sub').textContent = (area ? area + ' · ' : '') + info.state +
                (st && st.lc ? ' · ' + ago(st.lc) : '');

            var body = document.getElementById('panel-body');
            var h = '';
            var unavailable = info.unavailable;

            if (unavailable) {
                h = '<div class="info-line">This device is ' + escapeHtml(info.state.toLowerCase()) + ' in Home Assistant.</div>';
            } else if (d === 'light') {
                var modes = a.supported_color_modes || [];
                var dimmable = modes.length && !(modes.length === 1 && modes[0] === 'onoff');
                h += '<div class="panel-row">' + pbtn('toggle', st.s === 'on' ? 'Turn off' : 'Turn on', 'power', st.s === 'on') + '</div>';
                if (dimmable) h += slider('brightness', 'Brightness', st.s === 'on' && a.brightness != null ? Math.round(a.brightness / 2.55) : 0, 1, 100, '%');
            } else if (d === 'fan') {
                h += '<div class="panel-row">' + pbtn('toggle', st.s === 'on' ? 'Turn off' : 'Turn on', 'power', st.s === 'on') + '</div>';
                if (a.percentage != null || (a.supported_features & 1)) h += slider('fanpct', 'Speed', st.s === 'on' ? (a.percentage || 0) : 0, 0, 100, '%');
            } else if (d === 'cover') {
                var f = a.supported_features || 0;
                h += '<div class="panel-row">' +
                    ((f & 1) ? pbtn('open', 'Open', 'up') : '') +
                    ((f & 8) ? pbtn('stop', 'Stop', 'stop') : '') +
                    ((f & 2) ? pbtn('close', 'Close', 'down') : '') + '</div>';
                if ((f & 4) && a.current_position != null) h += slider('position', 'Position', a.current_position, 0, 100, '%');
            } else if (d === 'climate') {
                var unit = model.tempUnit;
                var target = a.temperature;
                h += '<div class="panel-row">';
                if (target != null) {
                    h += '<div class="pbtn round" data-act="tdown">' + svg('minus') + '</div>' +
                        '<div class="big-value" id="climate-target">' + fmtNum(target) + '<small>' + escapeHtml(unit) + '</small></div>' +
                        '<div class="pbtn round" data-act="tup">' + svg('plus') + '</div>';
                } else {
                    h += '<div class="info-line">No single target temperature in this mode.</div>';
                }
                h += '</div>';
                if (a.current_temperature != null) h += '<div class="info-line">Currently ' + fmtNum(a.current_temperature) + escapeHtml(unit) + (a.hvac_action ? ' · ' + escapeHtml(titleCase(a.hvac_action)) : '') + '</div>';
                var hm = (a.hvac_modes || []).slice(0, 6);
                if (hm.length) {
                    h += '<div class="panel-row">';
                    hm.forEach(function(m) { h += pbtn('mode:' + m, titleCase(m), null, st.s === m); });
                    h += '</div>';
                }
            } else if (d === 'media_player') {
                var title = a.media_title ? escapeHtml(a.media_title) + (a.media_artist ? ' - ' + escapeHtml(a.media_artist) : '') : escapeHtml(info.state);
                h += '<div class="info-line">' + title + '</div>';
                h += '<div class="panel-row">' +
                    '<div class="pbtn round" data-act="prev">' + svg('prev') + '</div>' +
                    '<div class="pbtn round' + (st.s === 'playing' ? ' on' : '') + '" data-act="playpause">' + svg(st.s === 'playing' ? 'pause' : 'play') + '</div>' +
                    '<div class="pbtn round" data-act="next">' + svg('next') + '</div>' +
                    pbtn('mpower', st.s === 'off' ? 'Turn on' : 'Turn off', 'power', st.s !== 'off') + '</div>';
                if (a.volume_level != null) h += slider('volume', 'Volume', Math.round(a.volume_level * 100), 0, 100, '%');
            } else if (d === 'lock') {
                h += '<div class="panel-row">' + pbtn('lock', 'Lock', 'lock', st.s === 'locked') + pbtn('unlock', 'Unlock', 'unlock', st.s === 'unlocked') + '</div>';
            } else if (d === 'sensor' || d === 'binary_sensor') {
                h += '<div class="info-big">' + (d === 'sensor' ? info.value : escapeHtml(info.state)) + '</div>';
                h += '<div class="info-line">Last changed ' + ago(st.lc) + '</div>';
            } else if (TOGGLE_DOMAINS[d]) {
                h += '<div class="panel-row">' + pbtn('toggle', st.s === 'on' ? 'Turn off' : 'Turn on', 'power', st.s === 'on') + '</div>';
            } else if (d === 'scene' || d === 'script') {
                h += '<div class="panel-row">' + pbtn('run', d === 'scene' ? 'Activate' : 'Run', d) + '</div>';
            } else if (d === 'button' || d === 'input_button') {
                h += '<div class="panel-row">' + pbtn('press', 'Press', 'button') + '</div>';
            } else {
                h += '<div class="info-big">' + escapeHtml(info.state) + '</div>';
            }
            body.innerHTML = h;
            body.querySelectorAll('.slider').forEach(bindSlider);
        }

        function pbtn(act, label, icon, on) {
            return '<div class="pbtn' + (on ? ' on' : '') + '" data-act="' + act + '">' + (icon ? svg(icon) : '') + '<span>' + escapeHtml(label) + '</span></div>';
        }
        function slider(key, label, val, min, max, unit) {
            var pct = (val - min) / (max - min) * 100;
            return '<div class="slider-wrap"><div class="slider-label">' + label + '</div>' +
                '<div class="slider" data-key="' + key + '" data-min="' + min + '" data-max="' + max + '" data-unit="' + unit + '">' +
                '<span style="width:' + pct + '%"></span></div>' +
                '<div class="slider-val">' + Math.round(val) + unit + '</div></div>';
        }

        function bindSlider(el) {
            var min = Number(el.getAttribute('data-min')), max = Number(el.getAttribute('data-max'));
            var unit = el.getAttribute('data-unit');
            var fill = el.querySelector('span');
            var label = el.parentNode.querySelector('.slider-val');
            var value = null;
            function setFrom(e) {
                var r = el.getBoundingClientRect();
                var f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
                value = Math.round(min + f * (max - min));
                fill.style.width = ((value - min) / (max - min) * 100) + '%';
                label.textContent = value + unit;
            }
            el.addEventListener('pointerdown', function(e) {
                sliderDragging = true;
                el.setPointerCapture(e.pointerId);
                setFrom(e);
                bumpPanelIdle();
            });
            el.addEventListener('pointermove', function(e) { if (sliderDragging) setFrom(e); });
            function end() {
                if (!sliderDragging) return;
                sliderDragging = false;
                if (value != null) onSlider(el.getAttribute('data-key'), value);
            }
            el.addEventListener('pointerup', end);
            el.addEventListener('pointercancel', end);
        }

        function onSlider(key, v) {
            var id = panelEntity;
            if (!id) return;
            if (key === 'brightness') call('light', 'turn_on', { brightness_pct: v }, id, true);
            else if (key === 'fanpct') call('fan', v === 0 ? 'turn_off' : 'set_percentage', v === 0 ? null : { percentage: v }, id, true);
            else if (key === 'position') call('cover', 'set_cover_position', { position: v }, id, true);
            else if (key === 'volume') call('media_player', 'volume_set', { volume_level: v / 100 }, id, true);
        }

        var tempDebounce = null, tempDraft = null;
        function onPanelAction(act) {
            if (panelArea) {
                var areaId = panelArea;
                if (act === 'room-on') areaLights(areaId, true);
                if (act === 'room-off') areaLights(areaId, false);
                if (act === 'room-open') { openArea(areaId); return; }
                closePanel();
                return;
            }
            var id = panelEntity;
            if (!id) return;
            bumpPanelIdle();
            var st = model.states[id] || { a: {} };
            var d = domainOf(id);
            if (act === 'toggle') return call(d, 'toggle', null, id, true);
            if (act === 'open') return call('cover', 'open_cover', null, id, true);
            if (act === 'close') return call('cover', 'close_cover', null, id, true);
            if (act === 'stop') return call('cover', 'stop_cover', null, id, false);
            if (act === 'lock') return call('lock', 'lock', null, id, true);
            if (act === 'unlock') return call('lock', 'unlock', null, id, true);
            if (act === 'run') return call(d, 'turn_on', null, id, false);
            if (act === 'press') return call(d, 'press', null, id, false);
            if (act === 'prev') return call('media_player', 'media_previous_track', null, id, false);
            if (act === 'next') return call('media_player', 'media_next_track', null, id, false);
            if (act === 'playpause') return call('media_player', 'media_play_pause', null, id, true);
            if (act === 'mpower') return call('media_player', st.s === 'off' ? 'turn_on' : 'turn_off', null, id, true);
            if (act.indexOf('mode:') === 0) return call('climate', 'set_hvac_mode', { hvac_mode: act.slice(5) }, id, true);
            if (act === 'tup' || act === 'tdown') {
                var a = st.a;
                var step = a.target_temp_step || (model.tempUnit === '°C' ? 0.5 : 1);
                var base = tempDraft != null ? tempDraft : Number(a.temperature);
                var next = base + (act === 'tup' ? step : -step);
                if (a.min_temp != null) next = Math.max(a.min_temp, next);
                if (a.max_temp != null) next = Math.min(a.max_temp, next);
                tempDraft = Math.round(next * 10) / 10;
                var el = document.getElementById('climate-target');
                if (el) el.innerHTML = fmtNum(tempDraft) + '<small>' + escapeHtml(model.tempUnit) + '</small>';
                clearTimeout(tempDebounce);
                // Wait for the user to stop tapping before sending one update.
                tempDebounce = setTimeout(function() {
                    var t = tempDraft; tempDraft = null;
                    call('climate', 'set_temperature', { temperature: t }, id, true);
                }, 900);
            }
        }

        function ago(ms) {
            var s = Math.max(0, Math.round((Date.now() - ms) / 1000));
            if (s < 60) return 'just now';
            if (s < 3600) return Math.floor(s / 60) + ' min ago';
            if (s < 86400) return Math.floor(s / 3600) + ' h ago';
            return Math.floor(s / 86400) + ' d ago';
        }

        DemoConnection.prototype.close = function() { this.closed = true; };
        DemoConnection.prototype.callService = function(domain, service, data, id) {
            var self = this;
            if (Array.isArray(id)) return Promise.all(id.map(function(one) { return self.callService(domain, service, data, one); }));
            var st = this.states[id];
            if (!st) return Promise.reject(new Error('Unknown entity'));
            var s = st.s, a = Object.assign({}, st.a);
            data = data || {};
            var flip = function(on, off) { return s === on ? off : on; };
            if (service === 'toggle') {
                if (domain === 'cover') { s = s === 'open' ? 'closed' : 'open'; a.current_position = s === 'open' ? 100 : 0; }
                else s = flip('on', 'off');
                if (domain === 'light' && s === 'on' && a.brightness == null) a.brightness = 180;
            } else if (service === 'turn_on' && domain === 'light') { s = 'on'; a.brightness = data.brightness_pct != null ? Math.round(data.brightness_pct * 2.55) : (a.brightness || 180); }
            else if (service === 'set_percentage') { s = 'on'; a.percentage = data.percentage; }
            else if (service === 'turn_off') s = 'off';
            else if (service === 'set_cover_position') { a.current_position = data.position; s = data.position > 0 ? 'open' : 'closed'; }
            else if (service === 'open_cover') { s = 'open'; a.current_position = 100; }
            else if (service === 'close_cover') { s = 'closed'; a.current_position = 0; }
            else if (service === 'lock') s = 'locked';
            else if (service === 'unlock') s = 'unlocked';
            else if (service === 'media_play_pause') s = flip('playing', 'paused');
            else if (service === 'volume_set') a.volume_level = data.volume_level;
            else if (service === 'set_temperature') a.temperature = data.temperature;
            else if (service === 'set_hvac_mode') { s = data.hvac_mode; a.hvac_action = s === 'off' ? 'off' : (s === 'cool' ? 'cooling' : 'heating'); }
            else return Promise.resolve();
            setTimeout(function() {
                if (self.closed) return;
                var plus = { s: s, a: a, lc: Date.now() / 1000 };
                self.states[id] = { s: s, a: a, lc: plus.lc };
                var c = {}; c[id] = { '+': plus };
                onEntitiesEvent({ c: c });
            }, 350);
            return Promise.resolve();
        };

        // ================================================================
        // Init
        // ================================================================
        var initialized = false;
        function onInit() {
            if (initialized) { readSettings(); return; }
            initialized = true;
            updatePreviewScale();
            window.addEventListener('resize', updatePreviewScale);
            mediaViewer = new MediaViewer({ container: document.getElementById('media-background') });
            document.getElementById('panel-close').innerHTML = svg('x');
            document.getElementById('panel-close').addEventListener('click', closePanel);
            document.getElementById('panel-body').addEventListener('click', function(e) {
                var b = e.target.closest('[data-act]');
                if (b) onPanelAction(b.getAttribute('data-act'));
            });
            attachTileHandlers();
            document.getElementById('nav-back').innerHTML = '<span class="nav-back-icon">' + svg('back') + '</span><span>Rooms</span>';
            document.getElementById('nav-back').addEventListener('click', goHome);
            document.getElementById('nav-lights').addEventListener('click', function() {
                var area = areaById(currentArea);
                if (area) areaLights(currentArea, roomStats(area).lightsOn.length === 0);
            });
            document.getElementById('container').addEventListener('pointerdown', bumpHome, true);
            document.getElementById('areas').addEventListener('scroll', updateScrollHint);
            window.addEventListener('resize', updateScrollHint);
            readSettings();
        }

        icueEvents = {
            "onICUEInitialized": onInit,
            "onDataUpdated": readSettings
        };

        // iCUE already initialized before script ran
        if (typeof iCUE_initialized !== 'undefined' && iCUE_initialized) {
            onInit();
        }

        // Standalone fallback (outside iCUE)
        if (typeof iCUE_initialized === 'undefined') { onInit(); }
    </script>
</body>
</html>
